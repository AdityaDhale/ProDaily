<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa44"/>
      <stop offset="100%" stop-color="#ff7711"/>
    </linearGradient>
    <linearGradient id="beanieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9922"/>
      <stop offset="100%" stop-color="#e66000"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfba"/>
      <stop offset="100%" stop-color="#f5c292"/>
    </linearGradient>
  </defs>

  <!-- Background Circle matching reference image -->
  <circle cx="60" cy="60" r="60" fill="url(#bgGrad)"/>

  <!-- Body / Shoulders -->
  <path d="M22 120 C22 96, 40 85, 60 85 C80 85, 98 96, 98 120 Z" fill="#1c2026"/>
  <!-- Hoodie collar -->
  <path d="M46 88 Q60 98 74 88 Q60 102 46 88 Z" fill="#ccff00"/>

  <!-- Neck -->
  <rect x="52" y="72" width="16" height="18" rx="4" fill="#f5c292"/>

  <!-- Head / Face -->
  <ellipse cx="60" cy="62" rx="22" ry="24" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <circle cx="38" cy="62" r="5" fill="#f5c292"/>
  <circle cx="82" cy="62" r="5" fill="#f5c292"/>

  <!-- Eyes with friendly highlight -->
  <circle cx="51" cy="61" r="3" fill="#1c2026"/>
  <circle cx="52" cy="60" r="1" fill="#ffffff"/>
  <circle cx="69" cy="61" r="3" fill="#1c2026"/>
  <circle cx="70" cy="60" r="1" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M47 54 Q51 51 56 54" stroke="#8c4b12" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M64 54 Q69 51 73 54" stroke="#8c4b12" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Friendly Smile -->
  <path d="M53 71 Q60 77 67 71" stroke="#a65418" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Cheeks Blush -->
  <ellipse cx="46" cy="67" rx="3.5" ry="2" fill="#ff7766" opacity="0.4"/>
  <ellipse cx="74" cy="67" rx="3.5" ry="2" fill="#ff7766" opacity="0.4"/>

  <!-- Orange Beanie Hat (matching reference screenshot) -->
  <path d="M37 50 C37 28, 83 28, 83 50 Z" fill="url(#beanieGrad)"/>
  <!-- Beanie Fold / Brim -->
  <rect x="35" y="44" width="50" height="9" rx="4.5" fill="#ff7711" stroke="#d95500" stroke-width="1"/>
  <!-- Beanie lines -->
  <path d="M44 44 L44 53 M52 44 L52 53 M60 44 L60 53 M68 44 L68 53 M76 44 L76 53" stroke="#e66000" stroke-width="1.2"/>
  <!-- Beanie Pom Pom -->
  <circle cx="60" cy="28" r="6" fill="#ffbb44"/>
</svg>
